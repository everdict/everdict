# Everdict full-stack production compose — web + API + Postgres (no Keycloak).
#
#   cp deploy/compose/.env.example deploy/compose/.env   # fill in the values (at minimum POSTGRES_PASSWORD)
#
# Two ways to run:
#   A) Pull prebuilt images from GHCR (fast, no local build) — needs the packages to be public:
#        docker compose -f deploy/compose/docker-compose.prod.yaml --env-file deploy/compose/.env up -d
#   B) Build from source (dev/custom, or when GHCR images aren't available):
#        docker compose -f deploy/compose/docker-compose.prod.yaml --env-file deploy/compose/.env up -d --build
#   Pin a released version with EVERDICT_VERSION=0.1.0 in .env (defaults to latest).
#
# Differences from dev (hardening):
#  - Postgres stores (persistent volume, migrations applied automatically at startup).
#  - Secret at-rest encryption (EVERDICT_SECRETS_KEY) + an internal token (EVERDICT_INTERNAL_TOKEN) + per-tenant run budgets (optional).
#  - restart: unless-stopped + health checks + depends_on(healthy).
#  - No source bind mounts — runs only from the runtime image's build artifacts.
#
# ⚠️ Auth: Keycloak (OIDC human login) is removed. The web has no static API-key path and operates as x-everdict-tenant=default,
#    so the API must accept the dev fallback too → EVERDICT_REQUIRE_AUTH is left unset (not enforced, single tenant default).
#    That is, this stack assumes a trusted network / behind a reverse proxy (do not expose it publicly).
#    If you need real auth:
#      · Programmatic/MCP access → EVERDICT_REQUIRE_AUTH=1 + mint API keys via /internal/tenant-keys (the web UI won't work then)
#      · Human SSO               → a reverse proxy such as oauth2-proxy in front, or add Keycloak back
name: everdict-prod

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-everdict}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-everdict}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-everdict} -d ${POSTGRES_DB:-everdict}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    # Pulled by default (GHCR); `up --build` builds this same tag from source instead.
    image: ghcr.io/everdict/everdict-api:${EVERDICT_VERSION:-latest}
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
      target: runtime
    environment:
      PORT: "8787"
      DATABASE_URL: postgresql://${POSTGRES_USER:-everdict}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-everdict}
      # Secret at-rest encryption KEK (base64, 32B). Leave empty to disable the secret store (fail-closed).
      EVERDICT_SECRETS_KEY: ${EVERDICT_SECRETS_KEY:-}
      # Guard token for /internal/** (minting API keys). Leave empty to disable those routes (fail-closed).
      EVERDICT_INTERNAL_TOKEN: ${EVERDICT_INTERNAL_TOKEN:-}
      # Per-tenant concurrent-run ceiling (optional). Leave empty for unlimited.
      EVERDICT_TENANT_RUNS: ${EVERDICT_TENANT_RUNS:-}
      # Needed only when the local backend runs the claude-code harness in-process (can be replaced by tenant secrets).
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      # Proactive teammates (S4): where + how the api pushes run/scorecard completions to the agent service so a
      # creator's watching teammates wake. AGENT_INTERNAL_TOKEN must match the agent service (x-internal-token).
      AGENT_SERVICE_URL: http://agent:8790
      AGENT_INTERNAL_TOKEN: ${AGENT_INTERNAL_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${API_PORT:-8787}:8787"
    restart: unless-stopped

  # ── Conversational agent (@everdict/agent, Fastify :8790) — the assistant behind the web chat + teammates ────
  # Needs a MODEL to answer: set AGENT_MODEL (a registered workspace model; requires EVERDICT_SECRETS_KEY to decrypt
  # its provider key) OR AGENT_LLM_* (a raw OpenAI-compatible endpoint). With neither the agent fails fast on boot —
  # web/api are unaffected (they do not wait on its health), only the chat is down until a model is configured.
  agent:
    image: ghcr.io/everdict/everdict-agent:${EVERDICT_VERSION:-latest}
    build:
      context: ../..
      dockerfile: apps/agent/Dockerfile
      target: runtime
    environment:
      PORT: "8790"
      CONTROL_PLANE_URL: http://api:8787
      DATABASE_URL: postgresql://${POSTGRES_USER:-everdict}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-everdict}
      EVERDICT_SECRETS_KEY: ${EVERDICT_SECRETS_KEY:-}
      # Model — set one (see the block comment above).
      AGENT_MODEL: ${AGENT_MODEL:-}
      AGENT_LLM_BASE_URL: ${AGENT_LLM_BASE_URL:-}
      AGENT_LLM_API_KEY: ${AGENT_LLM_API_KEY:-}
      AGENT_LLM_MODEL: ${AGENT_LLM_MODEL:-}
      # Proactive teammates — must equal the api's AGENT_INTERNAL_TOKEN.
      AGENT_INTERNAL_TOKEN: ${AGENT_INTERNAL_TOKEN:-}
      # Optional: eval-driving (HITL/RBAC-gated) + built-in web_search.
      AGENT_ALLOW_EVAL_DRIVE: ${AGENT_ALLOW_EVAL_DRIVE:-}
      AGENT_WEBSEARCH_API_KEY: ${AGENT_WEBSEARCH_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${AGENT_PORT:-8790}:8790"
    restart: unless-stopped

  web:
    # Pulled by default (GHCR); `up --build` builds this same tag from source instead.
    image: ghcr.io/everdict/everdict-web:${EVERDICT_VERSION:-latest}
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
      target: runtime
    environment:
      # The web (server) → API call uses the compose network's service name. KEYCLOAK_* unset → operates as tenant=default.
      CONTROL_PLANE_URL: http://api:8787
      # The web (server) proxies the assistant chat + teammates to the agent service over the compose network.
      AGENT_URL: http://agent:8790
    depends_on:
      - api
      - agent
    ports:
      - "${WEB_PORT:-3001}:3001"
    restart: unless-stopped

volumes:
  pgdata:
