<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>spica (fixture)</title>
    <style>
      body { font: 13px/1.5 system-ui, sans-serif; margin: 0; padding: 12px; color: #111; }
      h1 { font-size: 13px; margin: 0 0 10px; }
      button, a { font: inherit; }
      button { padding: 6px 10px; cursor: pointer; }
      nav, section { margin-top: 10px; }
      [hidden] { display: none !important; }
      code { background: #f2f2f3; padding: 2px 5px; border-radius: 3px; }
      .muted { color: #666; }
    </style>
  </head>
  <body>
    <h1>spica (fixture)</h1>

    <!-- The three controls the server clicks through, revealed in order: a flow, not three buttons on
         one screen, so the automation is exercised the way the real panel works. -->
    <button type="button" data-testid="menu-button">Menu</button>

    <nav data-testid="menu" hidden>
      <a href="#remote" data-testid="remote-view-link">Remote view</a>
    </nav>

    <section data-testid="remote-view" hidden>
      <button type="button" data-testid="remote-start-button">Start remote session</button>
    </section>

    <section data-testid="session" hidden>
      <p class="muted">Session</p>
      <!-- The id lives in an attribute AND the text: the server prefers the attribute, which survives
           copy and layout changes that would break a text read. -->
      <code data-session-id=""></code>
    </section>

    <p data-testid="error" class="muted" hidden></p>

    <script src="sidepanel.js"></script>
  </body>
</html>
