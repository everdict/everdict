name: Docs site

# The docs site is built from docs/** (content) + site/** (the Docusaurus app). It is deliberately a
# SEPARATE workflow from ci.yml: `site` is not a pnpm-workspace member, so the root quality gate and
# `pnpm ci:local` are unaffected by it, and a docs change does not pay for a full monorepo CI run.
#
# GitHub Pages gives no per-PR preview URL, so the pull-request job is the compensation: it runs the
# same build with `onBrokenLinks: 'throw'`, which fails on a dead link before anyone can merge one.

on:
  push:
    branches: [main]
    paths: ['docs/**', 'site/**', '.github/workflows/docs.yml']
  pull_request:
    paths: ['docs/**', 'site/**', '.github/workflows/docs.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # configure-pages needs these to CREATE the Pages site on the first run.
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          # showLastUpdateTime reads git history; without it every page warns and shows no date.
          fetch-depth: 0

      # No `version:` — it is resolved from the root package.json "packageManager", exactly as ci.yml
      # does. Pinning one here instead made action-setup fail on conflicting pnpm versions.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml

      - name: Documentation integrity (index · links · cited code paths)
        run: node scripts/check-docs.mjs

      - name: Install
        working-directory: site
        run: pnpm install --frozen-lockfile --ignore-workspace

      # Creates the Pages site on the first run (enablement: true) instead of requiring someone to
      # click through repository settings, and reports back the URL it will actually be served from —
      # so a custom domain configured later needs no edit here.
      - name: Configure Pages
        id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Build
        working-directory: site
        env:
          # Explicit rather than derived from the configure-pages outputs: `base_path` is empty for a
          # custom domain, so a `||` fallback would silently rebuild the whole site under the wrong
          # prefix. Change these two lines when a domain is added (DOCS_URL=https://<domain>,
          # DOCS_BASE_URL=/) and commit a site/static/CNAME.
          DOCS_URL: https://everdict.github.io
          DOCS_BASE_URL: /everdict/
        run: pnpm build

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/build

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
