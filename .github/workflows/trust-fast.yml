# trust-fast — the trust subset that gates a PUSH, not a night.
#
# `trust-nightly.yml` boots Temporal and MinIO and runs every scenario; that is tens of minutes and it lands
# at 03:00, on nobody. So the invariants it certifies were only ever certified AFTER the code that broke them
# had merged. This workflow is the other half of that trade: the scenarios that need nothing but a real
# Postgres, run on every push and pull request, as a REQUIRED check.
#
# Scope = every `*.trust.test.ts` that needs nothing but Postgres — `apps/api/src/trust` minus the two
# Temporal durability files (they start a test server and cost ~70s each — the nightly's job), PLUS the
# scenarios that live inside `packages/` and `apps/agent`.
#
# Those last two were nightly-only until arch-review 56, and it cost exactly what you would expect: the
# resume boolean→union change of arch-review 55 left `shadow-execution.trust.test.ts` asserting
# `resolves.toBe(false)`, and because that file sits in a package, the REQUIRED check could not see it. It
# was red for a day in a non-blocking job. Worse, it does not fail on a developer machine either — with no
# Postgres it SKIPS, which reads as silence rather than as a problem.
#
# The cost of closing that hole was measured before it was argued: `apps/api` is 304s of the 362s, so the
# added scope is ~43s on a job that already ran five minutes. It runs through `scripts/trust/trust-suite.mjs` rather than a bare
# `vitest run` for one reason: that script refuses to certify a suite whose scenarios SKIPPED. A required
# check that quietly skips is worse than no check — it prints the word a reviewer is looking for over an
# empty run.
#
# What the full suite certifies, and what this subset leaves to the nightly: docs/trust-certification.md.
name: trust-fast

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: trust-fast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trust-fast:
    # This name is the branch-protection contract — renaming the job silently un-requires the check.
    name: trust fast (real Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: everdict
          POSTGRES_PASSWORD: everdict # throwaway container on the runner's private network, never reachable off-box
          POSTGRES_DB: everdict_trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U everdict -d everdict_trust"
          --health-interval 5s --health-timeout 5s --health-retries 20
      # The ClickHouse lane's resolution rules are SQL — `argMin(x, (rank, clock))` either orders the way the
      # store claims or it does not, and MergeTree has no unique key so every read collapses duplicate rows
      # itself. A fake that echoes the query text answers happily to either. TRUST-192 is what the receipt's
      # attempt → the bytes it is served join rests on, and a SKIPPED scenario counts as FAIL, so this service
      # is part of the check rather than an optional extra.
      clickhouse:
        image: clickhouse/clickhouse-server:24-alpine
        ports: ["8123:8123"]
        options: >-
          --health-cmd "wget -q -O - http://127.0.0.1:8123/ping || exit 1"
          --health-interval 5s --health-timeout 5s --health-retries 30
          --ulimit nofile=262144:262144
    env:
      EVERDICT_TRUST_DATABASE_URL: postgresql://everdict:everdict@127.0.0.1:5432/everdict_trust
      EVERDICT_TRUST_CLICKHOUSE_URL: http://127.0.0.1:8123
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6 # version resolved from package.json "packageManager"
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The trust files import built package entrypoints (@everdict/db, @everdict/domain, …), same as any test.
      - run: pnpm build

      # ── AND ONE OBJECT STORE, ADDED DELIBERATELY (arch-review 68) ────────────────────────────────
      #
      # No Temporal here: the excluded prefix is what keeps this job a few minutes long, and the durability
      # scenarios it drops need a server this job does not start. They are NOT unowned — trust-nightly runs
      # them with the infrastructure they require.
      #
      # MinIO used to be in that same sentence, and four consecutive reviews are the argument for moving it.
      # 61, 62, 66 and 67 all centred on the two-phase case's intermediates — how the agent half is keyed,
      # whether its address authenticates its bytes, whether a taken key is the same bytes, who owes their
      # deletion — and every one of those repairs was certified against a mocked `S3Client.send` throwing a
      # SYNTHETIC 412. That proves the adapter's branch and cannot prove the premise it rests on, which is a
      # sentence about somebody else's software: `IfNoneMatch: "*"` reaching MinIO and coming back 412.
      #
      # Measured, not assumed: the container is ready in ~4s and TRUST-181 runs in under a second, against a
      # job that already takes minutes. Deleting the conditional create leaves the mocked counterexample 4/4
      # green and this scenario red — which is the whole reason it is on the blocking lane rather than the
      # nightly. Started with `docker run` for the reason the nightly does it: MinIO needs a server
      # subcommand, which the `services:` block cannot express.
      - name: Start MinIO
        run: |
          set -euo pipefail
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=everdict -e MINIO_ROOT_PASSWORD=everdict-trust \
            minio/minio:latest server /data
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:9000/minio/health/live >/dev/null && { echo "▶ minio ready after $((i * 2))s"; exit 0; }
            sleep 2
          done
          echo "✗ minio never became ready — the intermediate-artifact scenario has nothing to run against" >&2
          docker logs minio 2>&1 | tail -40 >&2
          exit 1

      - name: Trust suite (Postgres + object store + ClickHouse subset)
        env:
          EVERDICT_TRUST_S3_ENDPOINT: http://127.0.0.1:9000
          EVERDICT_TRUST_S3_ACCESS_KEY: everdict
          EVERDICT_TRUST_S3_SECRET_KEY: everdict-trust # throwaway container on the runner, never reachable off-box
        run: >-
          node scripts/trust/trust-suite.mjs
          apps/api/src/trust
          '!apps/api/src/trust/temporal-'
          packages
          apps/agent
