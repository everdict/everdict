# Nightly trust certification — the invariant suite that ci.yml deliberately does NOT run.
#
# `ci.yml` is the PUSH GATE: it must stay fast, so it runs unit tests against fakes on ubuntu only. This
# workflow is the opposite trade — it boots real infrastructure (Postgres, MinIO) and runs the scenarios that
# only real infrastructure can prove, plus an OS lane the push gate cannot afford. Nightly, never blocking.
#
# What it certifies, and what it deliberately leaves out: docs/trust-certification.md.
name: trust-nightly

on:
  schedule:
    - cron: "0 3 * * *" # 03:00 UTC daily
  workflow_dispatch:

concurrency:
  group: trust-nightly-${{ github.ref }}
  cancel-in-progress: true

# The Temporal the durability scenarios run against, NAMED — image AND version.
#
# Two nightly certifications failed here in a row, and the cause was not a flake: `temporalio/cli` stopped
# existing. The CLI image is published as `temporalio/temporal` now, and the old name answers "repository does
# not exist" — which a `latest` tag reports the same way it reports every other pull failure, at 03:00, to
# nobody. This suite spends its whole effort refusing moving references in what it EVALUATES; the thing it
# evaluates WITH was pulled from one. Bump deliberately, like any other pin.
env:
  TEMPORAL_CLI_IMAGE: "temporalio/temporal:1.8.2"

jobs:
  trust:
    name: trust certification (real Postgres + MinIO)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: everdict
          POSTGRES_PASSWORD: everdict # throwaway container on the runner's private network, never reachable off-box
          POSTGRES_DB: everdict_trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U everdict -d everdict_trust"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      EVERDICT_TRUST_DATABASE_URL: postgresql://everdict:everdict@127.0.0.1:5432/everdict_trust
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6 # version resolved from package.json "packageManager"
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The trust files import built package entrypoints (@everdict/db, @everdict/domain, …), same as any test.
      - run: pnpm build

      # MinIO for the workspace-filesystem scenario. Started with `docker run` rather than as a service
      # container because MinIO needs a server subcommand, which the `services:` block cannot express.
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=everdict -e MINIO_ROOT_PASSWORD=everdict-trust \
            minio/minio:latest server /data
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:9000/minio/health/live && break
            sleep 2
          done

      # Temporal for the durability scenario (TRUST-140). Same reason as MinIO — the dev server is a
      # subcommand, which `services:` cannot express. `start-dev` is an in-memory single-binary server: no
      # database of its own, and a real Temporal service as far as a worker is concerned.
      #
      # This is not optional garnish. Without it the durability scenario has nothing to run against, and the
      # suite's own rule is that a scenario which certified nothing is a FAILED certification — so a nightly
      # missing this line does not silently drop the claim, it fails.
      #
      # PINNED, and the wait ASSERTS. Two nightlies in a row failed here, on `latest` — this repository spends
      # its whole effort refusing moving references in what it EVALUATES, and then pulled the one piece of
      # infrastructure its durability claim rests on from a tag that moves under it. The version is named now,
      # and a readiness loop that runs out of attempts says so and fails the job, instead of falling through
      # to a suite that would meet an address nobody is listening on.
      - name: Start Temporal
        run: |
          set -euo pipefail
          docker run -d --name temporal -p 7233:7233 \
            "${TEMPORAL_CLI_IMAGE}" server start-dev --ip 0.0.0.0 --namespace default
          for i in $(seq 1 60); do
            if docker run --rm --network host "${TEMPORAL_CLI_IMAGE}" \
                 operator namespace describe default --address 127.0.0.1:7233 >/dev/null 2>&1; then
              echo "▶ temporal ready after $((i * 2))s"
              exit 0
            fi
            sleep 2
          done
          echo "✗ temporal never became ready — the durability scenarios have nothing to run against" >&2
          docker logs temporal 2>&1 | tail -40 >&2
          exit 1

      # The trust suite proper. The runner REFUSES to certify a suite whose scenarios skipped, so a broken
      # database connection fails the job instead of quietly reporting green over an empty run.
      - name: Trust suite
        env:
          EVERDICT_TRUST_TEMPORAL: 127.0.0.1:7233
        run: node scripts/trust/trust-suite.mjs

      # The pre-existing live scenario test for the workspace filesystem — CI can satisfy its env, so it runs
      # here. (Its twin, packages/graders model-judge.scenario, needs a paid model endpoint and stays off; see
      # docs/trust-certification.md for how an operator enables it.)
      - name: Workspace filesystem scenario (live MinIO)
        env:
          EVERDICT_E2E_S3_ENDPOINT: http://127.0.0.1:9000
          EVERDICT_E2E_S3_ACCESS_KEY: everdict
          EVERDICT_E2E_S3_SECRET_KEY: everdict-trust
        run: pnpm --filter @everdict/storage exec vitest run src/s3-fs.scenario.test.ts

      - name: MinIO logs on failure
        if: failure()
        run: docker logs minio || true

      - name: Temporal logs on failure
        if: failure()
        run: docker logs temporal || true

  # OS lane. Windows is the production gap the trust review named: self-hosted runners run on operators'
  # Windows machines, and nothing in CI has ever executed a line of this code there. It lives in the NIGHTLY
  # rather than in ci.yml on purpose — Windows runners are several times slower than ubuntu and cost several
  # times the minutes, and the push gate's value is that it is fast enough that nobody is tempted to skip it.
  #
  # The package scope is deliberately narrow and is documented in docs/trust-certification.md: these are the
  # packages whose tests are platform-independent by construction (pure logic, or explicitly branching on
  # process.platform). Packages that spawn a real POSIX shell are excluded there, with the expansion path.
  #
  # macOS is NOT here: cli-release.yml + desktop-release.yml already build and run on macos-latest every
  # release, so the OS has coverage. Windows had none.
  windows:
    name: windows unit lane
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Unit tests (OS-sensitive + platform-independent packages)
        run: >-
          pnpm --filter @everdict/contracts
          --filter @everdict/domain
          --filter @everdict/self-hosted-runner
          test
