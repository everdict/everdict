# Agent-configuration evals — does CLAUDE.md, the rules and the skills still carry their lessons?
#
# Triggered by what it tests. `docs-check` and `convention-harness` guard the SHAPE of that configuration;
# nothing asked whether the agent still does the work to the same standard after it changes. The nightly run
# exists because a model change moves the answer with no commit at all.
#
# Deliberately NOT part of `pnpm ci:local`, for the reason `pnpm protocol-mutations` left CI: a gate that
# makes every iteration wait gets switched off, and then nothing runs. See evals/README.md.
name: Agent evals

on:
  pull_request:
    paths: ["CLAUDE.md", ".claude/**", "evals/**"]
  push:
    branches: [main]
    paths: ["CLAUDE.md", ".claude/**", "evals/**"]
  schedule:
    - cron: "0 2 * * *" # 02:00 UTC daily
  workflow_dispatch:

jobs:
  evals:
    name: agent evals (configuration regression)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install -g @anthropic-ai/claude-code
      # No `if: secrets.ANTHROPIC_API_KEY != ''` guard on purpose. A suite that reports green because it never
      # executed is worse than none — the same rule the trust suite applies to a scenario that SKIPS — so a
      # missing key fails the job and the runner says which one is missing.
      - name: Run the suite
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node evals/run.mjs
      - name: Upload transcripts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-eval-transcripts
          path: evals/.results/
          if-no-files-found: ignore
