# Public CI — 5 quality gates (lint/typecheck/test/build) + empty-env boot contract + web (self-contained) + secret scan.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: lint · typecheck · test · build · boot
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6 # version resolved from package.json "packageManager"
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # Slim job-runner image guard — the @everdict/job-runner dependency cone must stay control-plane-free.
      - run: pnpm cone
      # Web runtime-decoupling guard — apps/web may import only TYPE-ONLY @everdict/contracts.
      - run: pnpm web-imports
      - run: pnpm migrations
      # Artifact-frame guard — the design system the agent's sandboxed dashboards compose from must stay in
      # step across contracts (the brief + the gate), the web frame (tokens + stylesheet) and the theme.
      - run: pnpm artifact-frame
      # Convention-harness guard — every .claude rule must still match live paths (a rule pointed at moved
      # code never fires, and it fails silently) and every skill must stay selectable.
      - run: pnpm convention-harness
      # ⚠️ `pnpm protocol-mutations` IS NOT HERE — it is the `mutations` job below. It is ~90 minutes of real
      # builds and real suites, and it sat as a step inside this 30-minute job, so it could never have
      # reached its own end and every gate declared after it could never have run at all (arch-review 120).
      # Plugin-manifest guard — this repo is a marketplace for two clients, and only Claude Code expands
      # ${VAR} in a plugin's .mcp.json; Codex must be pointed away from it or it registers the literal string.
      - run: pnpm plugin-manifests

      # Documentation integrity — the index covers every doc, links resolve, and cited code paths
      # still exist. It lives HERE, not only in docs.yml, because doc rot is caused by CODE moves and
      # docs.yml is path-filtered to docs/**.
      - run: pnpm docs-check
      - run: pnpm constructed-casts
      - run: pnpm guarded-doubles
      - run: pnpm unwired-capabilities
      - run: pnpm authz-optional
      - run: pnpm import-cycles
      - run: pnpm option-forwarding
      - run: pnpm language-policy
      - run: pnpm guard-siblings
      - run: pnpm source-bytes
      - run: pnpm mutation-leak
      # Self-host minimal-profile contract — the control plane must boot with zero optional env.
      - run: node scripts/live/empty-env-boot.mjs

  # ── THE MUTATION GATE, IN ITS OWN JOB AND SHARDED ─────────────────────────────────────────────────
  #
  # 252 rungs, each a real package build and a real suite. It does not fit in a step beside lint/typecheck/
  # test/build, and pretending it did meant nothing after it in `core` ever ran. Shards are whole BUILD
  # GROUPS (the script packs them longest-first), so every shard keeps the one-build-per-package-boundary
  # optimization instead of each re-compiling the same package.
  mutations:
    name: protocol mutations (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false # every shard's answer is wanted: a second failing shard is a second lost test.
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm protocol-mutations --shard ${{ matrix.shard }}/4

  # A green shard is not a green gate. This is the single check to require: it is red unless EVERY shard
  # passed, including the ones that were skipped or cancelled.
  mutations-complete:
    name: protocol mutations (all shards)
    runs-on: ubuntu-latest
    needs: mutations
    if: always()
    steps:
      - run: |
          if [ "${{ needs.mutations.result }}" != "success" ]; then
            echo "protocol mutations: at least one shard did not pass (${{ needs.mutations.result }})"
            exit 1
          fi
          echo "every protocol-mutation shard passed"

  web:
    name: web (self-contained lint · build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # apps/web type-anchors to @everdict/contracts (type-only) — its d.ts must exist before next build's tsc.
      - run: pnpm -F @everdict/contracts build
      - run: pnpm -F @everdict/web lint
      - run: pnpm -F @everdict/web build

  gitleaks:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # full history scan
      - name: Run gitleaks
        run: |
          curl -sL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks git . --config .gitleaks.toml --log-opts="--all" --no-banner
