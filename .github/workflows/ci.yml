# Public CI — 5 quality gates (lint/typecheck/test/build) + empty-env boot contract + web (self-contained) + secret scan.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: lint · typecheck · test · build · boot
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6 # version resolved from package.json "packageManager"
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # Slim job-runner image guard — the @everdict/job-runner dependency cone must stay control-plane-free.
      - run: pnpm cone
      # Web runtime-decoupling guard — apps/web may import only TYPE-ONLY @everdict/contracts.
      - run: pnpm web-imports
      - run: pnpm migrations
      # Artifact-frame guard — the design system the agent's sandboxed dashboards compose from must stay in
      # step across contracts (the brief + the gate), the web frame (tokens + stylesheet) and the theme.
      - run: pnpm artifact-frame
      # Convention-harness guard — every .claude rule must still match live paths (a rule pointed at moved
      # code never fires, and it fails silently) and every skill must stay selectable.
      - run: pnpm convention-harness
      # ⚠️ `pnpm protocol-mutations` IS NOT IN CI AT ALL (2026-08-29, by decision). It is ~90 minutes of real
      # builds and real suites — it could never fit here (it once sat as a step inside this 30-minute job, so
      # it never reached its own end and every gate declared after it never ran), and as its own sharded job
      # it still made every push wait on an hour of compute. It is ON DEMAND: `pnpm protocol-mutations
      # [--only <name>] [--shard i/n]`. What that costs is stated in rule `ci`; what it buys — the evidence
      # that a counterexample would fail without its protocol — is now bought per change, not per push.
      # Plugin-manifest guard — this repo is a marketplace for two clients, and only Claude Code expands
      # ${VAR} in a plugin's .mcp.json; Codex must be pointed away from it or it registers the literal string.
      - run: pnpm plugin-manifests

      # Documentation integrity — the index covers every doc, links resolve, cited code paths still exist,
      # and every document declares a kind from the closed set. It lives HERE, in the code gate, because doc
      # rot is caused by CODE moves: a path-filtered docs job would never run for the commit that broke it.
      # It is now the ONLY gate over docs/ — the separate site workflow was removed with the site itself
      # (docs/architecture/docs-site-removal.md).
      - run: pnpm docs-check
      # Every browser-facing route is reachable from the web, or carries the reason it is not. A door
      # nobody opens looks exactly like a door nobody needed, and nothing else asks.
      - run: pnpm web-reach
      - run: pnpm constructed-casts
      - run: pnpm guarded-doubles
      - run: pnpm unwired-capabilities
      - run: pnpm gated-doors
      - run: pnpm unwired-guards
      - run: pnpm authz-optional
      - run: pnpm import-cycles
      - run: pnpm option-forwarding
      - run: pnpm language-policy
      - run: pnpm guard-siblings
      - run: pnpm source-bytes
      - run: pnpm untrusted-ingress
      - run: pnpm mutation-leak
      # Self-host minimal-profile contract — the control plane must boot with zero optional env.
      - run: node scripts/live/empty-env-boot.mjs

  web:
    name: web (self-contained lint · build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # apps/web type-anchors to @everdict/contracts (type-only) — its d.ts must exist before next build's tsc.
      - run: pnpm -F @everdict/contracts build
      - run: pnpm -F @everdict/web lint
      - run: pnpm -F @everdict/web build

  gitleaks:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # full history scan
      - name: Run gitleaks
        run: |
          curl -sL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks git . --config .gitleaks.toml --log-opts="--all" --no-banner
